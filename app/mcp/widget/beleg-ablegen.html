<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Beleg ablegen</title>
<style>
    :root {
        --fg: #1d1d1f; --muted: #5f6368; --bg: transparent; --line: #c4c7cc; --accent: #0b5cad; --ok: #1a7f37; --bad: #b42318; --drop: rgba(11, 92, 173, .07);
    }
    @media (prefers-color-scheme: dark) {
        :root { --fg: #ececec; --muted: #a0a4ab; --line: #4a4d52; --accent: #6cb2f5; --ok: #5fd17f; --bad: #ff8f85; --drop: rgba(108, 178, 245, .12); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
    h1 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
    .summary { margin: 0 0 10px; color: var(--muted); }
    .summary span + span::before { content: " · "; }
    .drop { display: block; padding: 20px 12px; border: 2px dashed var(--line); border-radius: 8px; text-align: center; cursor: pointer; }
    .drop.over { border-color: var(--accent); background: var(--drop); }
    .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .status { margin: 10px 0 0; min-height: 1.45em; }
    .status.ok { color: var(--ok); font-weight: 600; }
    .status.bad { color: var(--bad); }
    progress { width: 100%; height: 8px; margin-top: 8px; }
    button { margin-top: 8px; padding: 8px 14px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--accent); border-radius: 6px; cursor: pointer; min-height: 40px; }
    .hint { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
    a { color: var(--accent); }
    [hidden] { display: none !important; }
</style>
</head>
<body>
<h1 id="head">Beleg ablegen</h1>
<p class="summary" id="summary" hidden></p>
<label class="drop" id="drop" hidden>
    <span id="drop-text">Datei hierher ziehen oder tippen zum Auswählen</span>
    <input type="file" id="file" accept="image/*,application/pdf">
</label>
<progress id="progress" max="100" value="0" hidden></progress>
<p class="status" id="status" role="status" aria-live="polite">Verbinde …</p>
<button type="button" id="renew" hidden>Neue Adresse holen</button>
<p class="hint" id="hint" hidden>Klappt es hier nicht? Leg die Datei <a id="inbox" href="#" target="_blank" rel="noopener">in den Eingang</a>.</p>
<script>
(function () {
    'use strict';

    var INIT_TIMEOUT_MS = 5000;
    var MAX_PHOTO_EDGE = 2560;
    var JPEG_QUALITY = 0.85;
    var DEFAULT_MAX_BYTES = 30 * 1024 * 1024;
    var PROTOCOL_VERSION = '2026-01-26';
    var UNSUPPORTED = 'Das Widget wird hier nicht unterstützt. Leg die Datei in den Eingang.';

    var el = {
        head: document.getElementById('head'), summary: document.getElementById('summary'), drop: document.getElementById('drop'),
        dropText: document.getElementById('drop-text'), file: document.getElementById('file'), progress: document.getElementById('progress'),
        status: document.getElementById('status'), renew: document.getElementById('renew'), hint: document.getElementById('hint'), inbox: document.getElementById('inbox')
    };

    var nextId = 2;
    var pending = {};
    var documentId = null;
    var lastData = {};
    var upload = null;
    var busy = false;
    var initialized = false;
    var failed = false;

    function send(message) {
        window.parent.postMessage(message, '*');
    }

    function request(method, params) {
        return new Promise(function (resolve, reject) {
            var id = nextId++;
            pending[id] = { resolve: resolve, reject: reject };
            send({ jsonrpc: '2.0', id: id, method: method, params: params });
        });
    }

    function setStatus(text, kind) {
        el.status.textContent = text;
        el.status.className = 'status' + (kind ? ' ' + kind : '');
    }

    function showProgress(value) {
        el.progress.hidden = value === null;
        if (value !== null) {
            el.progress.value = value;
        }
    }

    function unsupported() {
        failed = true;
        el.drop.hidden = true;
        el.renew.hidden = true;
        showProgress(null);
        setStatus(UNSUPPORTED, 'bad');
        el.hint.hidden = true;
    }

    function parseResult(result) {
        if (!result) {
            return null;
        }
        if (result.structuredContent && typeof result.structuredContent === 'object') {
            return result.structuredContent;
        }
        var first = Array.isArray(result.content) ? result.content[0] : null;
        if (first && typeof first.text === 'string') {
            try {
                return JSON.parse(first.text);
            } catch (error) {
                return null;
            }
        }

        return null;
    }

    function inboxLink(url) {
        try {
            el.inbox.href = new URL(url).origin + '/garage/eingang.html';
            el.hint.hidden = false;
        } catch (error) {
            el.hint.hidden = true;
        }
    }

    function renderSummary(data) {
        el.head.textContent = 'Beleg ablegen' + (data.vehicle_label ? ' · ' + data.vehicle_label : '');
        el.summary.textContent = '';
        [data.doc_type, data.title, data.captured_on].forEach(function (part) {
            if (part) {
                var span = document.createElement('span');
                span.textContent = part;
                el.summary.appendChild(span);
            }
        });
        if (Array.isArray(data.attached_to) && data.attached_to.length > 0) {
            var attached = document.createElement('span');
            attached.textContent = 'Hängt an ' + data.attached_to.map(function (a) { return a.target_table + ' ' + a.target_id; }).join(', ');
            el.summary.appendChild(attached);
        }
        el.summary.hidden = el.summary.childNodes.length === 0;
    }

    function showDone(text) {
        el.drop.hidden = true;
        el.renew.hidden = true;
        showProgress(null);
        setStatus(text || 'Abgelegt', 'ok');
    }

    function showWaiting() {
        el.renew.hidden = true;
        el.drop.hidden = false;
        showProgress(null);
        setStatus('Wartet auf die Datei.');
        busy = false;
    }

    function onToolResult(params) {
        var data = parseResult(params);
        if (!data || (data.document_id === undefined && data.id === undefined)) {
            return;
        }
        documentId = data.document_id !== undefined ? data.document_id : data.id;
        lastData = data;
        renderSummary(data);
        if (data.status && data.status !== 'wartet') {
            showDone('Abgelegt');
            return;
        }
        upload = data.upload || null;
        if (!upload || !upload.upload_url) {
            unsupported();
            return;
        }
        inboxLink(upload.upload_url);
        showWaiting();
    }

    // --- Foto verkleinern (aus web/js/image.js kopiert) ---
    function canvasToJpeg(canvas) {
        return new Promise(function (resolve, reject) {
            canvas.toBlob(function (blob) {
                if (blob === null) {
                    reject(new Error('Das Bild lässt sich nicht umwandeln.'));
                    return;
                }
                resolve(blob);
            }, 'image/jpeg', JPEG_QUALITY);
        });
    }

    async function shrinkPhoto(file) {
        var bitmap;
        try {
            bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
        } catch (error) {
            throw new Error('Das Foto lässt sich nicht lesen. HEIC bitte als JPEG aufnehmen oder speichern.');
        }
        var longest = Math.max(bitmap.width, bitmap.height);
        if (longest <= MAX_PHOTO_EDGE) {
            bitmap.close();

            return file;
        }
        var scale = MAX_PHOTO_EDGE / longest;
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        bitmap.close();

        return canvasToJpeg(canvas);
    }

    function post(url, blob) {
        return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', url);
            xhr.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
            xhr.upload.onprogress = function (event) {
                if (event.lengthComputable) {
                    var percent = Math.round(event.loaded / event.total * 100);
                    showProgress(percent);
                    setStatus('Lädt ' + percent + ' % …');
                }
            };
            xhr.onload = function () { resolve(xhr); };
            xhr.onerror = function () { reject(new Error('Keine Verbindung zu GARAGE.')); };
            xhr.send(blob);
        });
    }

    function errorText(xhr) {
        try {
            var body = JSON.parse(xhr.responseText);
            if (body && body.message) {
                return body.message;
            }
        } catch (error) { /* kein JSON */ }

        return 'Der Upload ist fehlgeschlagen (' + xhr.status + ').';
    }

    async function handleFile(file) {
        if (busy || !file || !upload) {
            return;
        }
        busy = true;
        el.drop.hidden = true;
        showProgress(0);
        try {
            setStatus('Bereite vor …');
            var blob = file;
            if (file.type.indexOf('image/') === 0) {
                blob = await shrinkPhoto(file);
            }
            if (blob.size > (upload.max_bytes || DEFAULT_MAX_BYTES)) {
                throw new Error('Die Datei ist zu groß (höchstens ' + Math.round((upload.max_bytes || DEFAULT_MAX_BYTES) / 1048576) + ' MB).');
            }
            setStatus('Lädt 0 % …');
            var xhr = await post(upload.upload_url, blob);
            if (xhr.status === 410 || xhr.status === 404) {
                showProgress(null);
                el.renew.hidden = false;
                setStatus('Upload abgelaufen. Hol dir eine neue Adresse und versuch es noch einmal.', 'bad');
                return;
            }
            if (xhr.status < 200 || xhr.status >= 300) {
                throw new Error(errorText(xhr));
            }
            setStatus('Bestätige …');
            var confirmed = parseResult(await request('tools/call', { name: 'confirm_document', arguments: { document_id: documentId } }));
            showDone('Abgelegt');
            if (confirmed) {
                renderSummary(Object.assign({}, lastData, confirmed));
            }
        } catch (error) {
            showProgress(null);
            el.drop.hidden = false;
            busy = false;
            setStatus(error && error.message ? error.message : 'Das hat nicht geklappt.', 'bad');
        }
    }

    el.file.addEventListener('change', function () {
        handleFile(el.file.files[0]);
        el.file.value = '';
    });
    ['dragenter', 'dragover'].forEach(function (name) {
        el.drop.addEventListener(name, function (event) { event.preventDefault(); el.drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (name) {
        el.drop.addEventListener(name, function (event) { event.preventDefault(); el.drop.classList.remove('over'); });
    });
    el.drop.addEventListener('drop', function (event) {
        handleFile(event.dataTransfer && event.dataTransfer.files[0]);
    });

    el.renew.addEventListener('click', async function () {
        el.renew.hidden = true;
        setStatus('Hole neue Adresse …');
        try {
            var data = parseResult(await request('tools/call', { name: 'request_upload', arguments: { document_id: documentId } }));
            if (!data || !data.upload_url) {
                throw new Error('keine Adresse');
            }
            upload = data;
            showWaiting();
        } catch (error) {
            el.renew.hidden = false;
            setStatus('Die neue Adresse ließ sich nicht holen. Leg die Datei in den Eingang.', 'bad');
        }
    });

    window.addEventListener('message', function (event) {
        if (event.source !== window.parent) {
            return;
        }
        var message = event.data;
        if (!message || message.jsonrpc !== '2.0') {
            return;
        }
        if (message.id !== undefined && !message.method && pending[message.id]) {
            var entry = pending[message.id];
            delete pending[message.id];
            if (message.error) {
                entry.reject(new Error(message.error.message || 'Fehler'));
            } else if (message.result && message.result.isError) {
                var errorData = parseResult(message.result);
                entry.reject(new Error(errorData && errorData.message ? errorData.message : 'Fehler'));
            } else {
                entry.resolve(message.result);
            }
            return;
        }
        if (message.method === 'ui/notifications/tool-result') {
            onToolResult(message.params);
        }
    });

    var timer = setTimeout(function () {
        if (!initialized) {
            unsupported();
        }
    }, INIT_TIMEOUT_MS);

    var initRequest = new Promise(function (resolve, reject) {
        pending[1] = { resolve: resolve, reject: reject };
    });
    send({ jsonrpc: '2.0', id: 1, method: 'ui/initialize', params: { protocolVersion: PROTOCOL_VERSION, appInfo: { name: 'garage-beleg', version: '1' }, appCapabilities: {} } });
    initRequest.then(function () {
        initialized = true;
        clearTimeout(timer);
        send({ jsonrpc: '2.0', method: 'ui/notifications/initialized' });
        if (!failed && documentId === null) {
            setStatus('Warte auf den Beleg …');
        }
    }, unsupported);
}());
</script>
</body>
</html>
