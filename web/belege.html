<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Belege – GARAGE</title>
    <link rel="icon" href="data:,">
    <link rel="manifest" href="/garage/manifest.webmanifest">
    <link rel="stylesheet" href="/garage/css/tokens.css">
    <link rel="stylesheet" href="/garage/css/base.css">
    <script type="module" src="/garage/js/theme.js"></script>
</head>
<body>
    <a class="skip-link" href="#inhalt">Zum Inhalt springen</a>
    <main id="inhalt">
        <a id="back-link" class="back" href="#" hidden>← Belege</a>
        <h1 id="page-title" class="sr-only">GARAGE</h1>
        <p id="status" role="status">Lädt …</p>

        <section id="list-view" hidden>

                <h2>Belege</h2>
                <div class="view-toggle" role="group" aria-label="Ansicht">

                    <button type="button" id="view-gallery" aria-pressed="false">Galerie</button>
                </div>
            </div>
            <div id="vehicle-chips" class="chips" role="group" aria-label="Fahrzeug"></div>
            <p id="list-error" class="error" role="alert" tabindex="-1" hidden></p>
            <div id="list-body"></div>
        </section>

        <section id="detail-view" hidden>
            <p id="detail-error" class="error" role="alert" tabindex="-1" hidden></p>
            <div id="detail-body"></div>
        </section>
    </main>
    <script type="module" src="/garage/js/document.js"></script>

</html>
