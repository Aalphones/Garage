      <div class="field"><label for="st-r">Grund (optional)</label><input id="st-r" placeholder="z. B. verkauft an Privat, 11/2026"></div>
      <div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" data-ok>Status speichern</button></div>${tool('PATCH /garage/api/vehicles/{id} · nur Inhaber')}`, () => toast('Status gespeichert', () => {}));
    return;
  }
  if (act === 'delcar') {
    S.openMenu = false; rerender();
    sheet(`<h2 id="sh-t">Golf Sportsvan löschen?</h2><p class="small">Das Fahrzeug verschwindet aus Garage, Fälligkeiten und Suche. Akte und Belege bleiben gespeichert und lassen sich bis zu 30 Tage wiederherstellen.</p>
      <div class="field"><label for="dl-r">Grund</label><input id="dl-r" placeholder="z. B. doppelt angelegt"></div>
      <div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn danger" type="button" data-ok>Fahrzeug löschen</button></div>${tool('DELETE /garage/api/vehicles/{id} · nur Inhaber, nur Mensch')}`, () => toast('Golf Sportsvan gelöscht', () => {}));
    return;
  }
  if (act === 'print' || act === 'md') { S.openMenu = false; if (act === 'print') location.hash = '#druck/golf'; else toast('Akte als Markdown heruntergeladen'); return; }
  if (act === 'doprint') { print(); return; }
  if (act === 'restorecar') { Object.assign(D.vehicles.golf2, { status: 'aktiv', km: 26921, kmBasis: 'ein Stand', next: { t: 'keine Regel', s: 'ok', when: 'noch kein Wartungsplan' } }); S.filter = 'aktiv'; rerender(); toast('Golf (doppelt) wiederhergestellt', () => { D.vehicles.golf2.status = 'geloescht'; rerender(); }); return; }
  if (act === 'doc') {
    const photo = !!el.dataset.photo;
    sheet(`<h2 id="sh-t">${photo ? 'Foto Tacho' : 'Rechnung 4711'}</h2><div class="doc" style="pointer-events:none;margin:.8rem 0"><div class="pv" style="aspect-ratio:3/4;max-height:45vh">${photo ? I.photo : I.doc}</div></div><p class="muted small">Vollbild mit Wischen wie in Meilenstein 3 (belege.html#beleg/&lt;id&gt;). ${B}</p>
      <div class="foot">${photo && canWrite() ? `<button class="btn" type="button" data-ok>${I.photo}Als Titelbild setzen</button>${tool('POST /garage/api/vehicles/{id}/cover')}` : ''}<button class="btn" type="button" data-close>Schließen</button></div>`, () => toast('Titelbild gesetzt', () => {}));
    return;
  }
  if (act === 'addkm') {
    sheet(`<h2 id="sh-t">Kilometerstand eintragen</h2>
      <div class="field"><label for="km-v">Kilometer laut Tacho</label><input id="km-v" inputmode="numeric" pattern="[0-9]*" placeholder="z. B. 27350"></div>
      <div class="field"><label for="km-d">Abgelesen am</label><input id="km-d" type="date" value="2026-11-18"></div>
      <div class="field"><label for="km-n">Notiz (optional)</label><input id="km-n" placeholder="z. B. vor dem Urlaub"></div>
      <p class="muted small">Gilt als deine Angabe. Ist der Stand kleiner als ein früherer, entsteht ein Klärfall statt eines Fehlers.</p>
      <div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" data-ok>Stand speichern</button></div>`, () => toast('Kilometerstand gespeichert'));
    return;
  }
  if (act === 'editfact') {
    sheet(`<h2 id="sh-t">${el.dataset.k} korrigieren</h2>
      <div class="field"><label for="f-v">${el.dataset.k}</label><input id="f-v" value="${el.dataset.v}"></div>
      <p class="muted small">Dein Wert ersetzt den bisherigen sofort (Herkunft: Nutzer, bestätigt). Der alte Wert bleibt im Verlauf.</p>
      <div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" data-ok>Wert speichern</button></div>${tool('PATCH /garage/api/vehicles/{id}/facts · nur Mensch')}`, () => toast(`${el.dataset.k} gespeichert`, () => {}));
    return;
  }
  if (act === 'note-new' || act === 'note-edit') {
    const edit = act === 'note-edit';
    sheet(`<h2 id="sh-t">${edit ? 'Notiz bearbeiten' : 'Notiz anlegen'}</h2>
      <div class="field"><label for="no-t">Thema</label><input id="no-t" value="${edit ? 'DSG-Langlebigkeitsstrategie' : ''}" placeholder="z. B. Reifendruck"></div>
      <div class="field"><label for="no-b">Text</label><textarea id="no-b" rows="6">${edit ? 'Ölwechsel DSG vorziehen auf 60.000 km; Kupplung schonen: im Stau N statt D …' : ''}</textarea></div>
      <p class="muted small">${edit ? 'Speichern legt Revision 4 an; frühere bleiben erhalten.' : 'Gleiches Thema wie eine vorhandene Notiz ergänzt diese als neue Revision.'}</p>
      <div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" data-ok>Notiz speichern</button></div>${tool('PUT /garage/api/vehicles/{id}/notes')}`, () => toast('Notiz gespeichert'));
    return;
  }
  if (act === 'note') { sheet(`<h2 id="sh-t">Notiz zur Entscheidung</h2><div class="field"><label for="n-t">Notiz (höchstens 500 Zeichen)</label><textarea id="n-t" maxlength="500" placeholder="z. B. Werkstatt hat 0W-20 freigegeben"></textarea></div><div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" data-ok>Notiz übernehmen</button></div>`); return; }
  if (act === 'allfacts') { toast('Klappt alle Angaben, Ausstattung und Zulassungen auf'); return; }
  if (act === 'fuel') {
    const v = location.hash.split('/')[1] === 'clio' ? 'Clio' : 'Golf';
    sheet(`<h2 id="sh-t">Tankung eintragen · ${v}</h2>
      <div class="grid2"><div class="field"><label for="fu-d">Datum</label><input id="fu-d" type="date" value="2026-11-24"></div>
      <div class="field"><label for="fu-k">Kilometer laut Tacho</label><input id="fu-k" inputmode="numeric" pattern="[0-9]*" placeholder="≈ 27.310"></div>
      <div class="field"><label for="fu-l">Liter</label><input id="fu-l" inputmode="decimal" placeholder="z. B. 38,4"></div>
      <div class="field"><label for="fu-e">Betrag gesamt (€)</label><input id="fu-e" inputmode="decimal" placeholder="z. B. 66,20"></div></div>
      <label class="toggle"><input type="checkbox" id="fu-full" checked><span class="tr" aria-hidden="true"></span><span class="lbl">Voll getankt<small>Verbrauch rechnet GARAGE zwischen zwei Volltankungen.</small></span></label>
      <p class="muted small">Gilt als deine Angabe. Der km-Stand zählt auch als Kilometerstand; ist er kleiner als ein früherer, entsteht ein Klärfall.</p>
      <div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" data-ok>Tankung speichern</button></div>${tool('POST /garage/api/vehicles/{id}/fuel = record_fuel')}`, () => toast('Tankung gespeichert · 6,6 l/100 km', () => {}));
    return;
  }
  if (act === 'expense') {
    sheet(`<h2 id="sh-t">Ausgabe eintragen</h2>
      <div class="grid2"><div class="field"><label>Kategorie</label>${dd('excat', 'Kategorie', ['Parken', 'Wäsche', 'Pflege', 'Maut', 'Reifeneinlagerung', 'Bußgeld', 'Sonstiges'], 'Parken')}</div>
      <div class="field"><label for="ex-e">Betrag (€)</label><input id="ex-e" inputmode="decimal" placeholder="z. B. 6,50"></div>
      <div class="field"><label for="ex-d">Datum</label><input id="ex-d" type="date" value="2026-11-24"></div>
      <div class="field"><label for="ex-n">Notiz (optional)</label><input id="ex-n" maxlength="200" placeholder="z. B. Parkhaus Flughafen"></div></div>
      <p class="muted small">Zählt im Block Betrieb am Tag der Ausgabe. Werkstatt und Verträge erfasst der Agent aus Belegen.</p>
      <div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" data-ok>Ausgabe speichern</button></div>${tool('POST /garage/api/vehicles/{id}/expenses = record_expense')}`, () => toast('Ausgabe gespeichert', () => {}));
    return;
  }
  if (act === 'delrow') {
    const id = el.dataset.id; S.deleted.add(id); rerender();
    toast(`${el.dataset.what} gelöscht — im Verlauf sichtbar`, () => { S.deleted.delete(id); rerender(); });
    return;
  }
  if (act === 'calcopy') { toast('Kalender-Link kopiert'); return; }
  if (act === 'calrotate') { toast('Neuer Link erzeugt — der alte gilt nicht mehr. Im Kalender neu abonnieren.'); return; }
  if (act === 'reload') { $('#dz-state').value = 'normal'; S.state = 'normal'; rerender(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.openMenu) { S.openMenu = false; rerender(); } });

/* ===== Entwurfsleiste ===== */
const params = new URLSearchParams(location.search);
const setTheme = t => { document.documentElement.dataset.theme = t; $('#dz-theme').value = t; S.look = t === 'light' ? 'Hell' : 'Dunkel'; };
setTheme(params.get('theme') || 'dark');
$('#dz-theme').onchange = e => { setTheme(e.target.value); rerender(); };
$('#dz-role').onchange = e => { S.role = e.target.value; rerender(); };
$('#dz-state').onchange = e => { S.state = e.target.value; rerender(); };
$('#dz-tools').onchange = e => document.body.classList.toggle('tools', e.target.checked);
$('#dz-jump').onchange = e => { if (e.target.value) location.hash = e.target.value; e.target.value = ''; };
if (params.get('tools')) { $('#dz-tools').checked = true; document.body.classList.add('tools'); }
if (params.get('state')) { S.state = params.get('state'); $('#dz-state').value = S.state; }
if (params.get('role')) { S.role = params.get('role'); $('#dz-role').value = S.role; }
const bp = () => { const w = innerWidth; $('#dz-bp').textContent = (w < 576 ? 'Handy' : w < 992 ? 'Tablet' : w < 1408 ? 'Laptop' : 'Desktop') + ' · ' + w + ' px'; };
addEventListener('resize', bp); bp();
route();
if (params.get('open') === 'status') document.querySelector('[data-act=status]')?.click();
if (params.get('open') === 'src') document.querySelector('.src')?.click();
if (params.get('open') === 'dd') document.querySelector('.dd > button')?.click();
if (params.get('open') === 'oi') { const d = document.querySelector('.xrow'); if (d) { d.open = true; d.scrollIntoView(); } }
if (params.get('open') === 'km') document.querySelector('[data-act=addkm]')?.click();
if (params.get('open') === 'fact') document.querySelector('[data-act=editfact]')?.click();
if (params.get('open') === 'fuel') document.querySelector('[data-act=fuel]')?.click();
if (params.get('open') === 'expense') { document.querySelector('[data-act=expense]')?.click(); if (params.get('dd')) document.querySelector('.sheet .dd > button')?.click(); }
/* Diagramm-Werte per Tippen (Handy) — Überfahren zeigt den Titel */
document.addEventListener('click', e => { const m = e.target.closest?.('rect[data-why], circle[data-why]'); if (m) tipText(m, m.dataset.t, m.dataset.why); });</script>
</body>
</html>
