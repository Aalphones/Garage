<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GARAGE · Entwurf Meilenstein 4 „Oberfläche“</title>
<style>
/* ===== Design-Tokens (GARAGE, Familie „Dark Botanical“ wie DISPATCH) ===== */
:root, :root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #090C0C; --bg-deep: #0C2421; --surface: #131918; --raised: #1B2322; --border: #56746E; --line: #232D2B;
  --text: #EEF2EC; --muted: #9DADA8;
  --primary: #43D6C5; --primary-hover: #62E0D0; --on-primary: #04201D;
  --leaf: #78C850;
  --bad: #F08A80; --bad-soft: #2E1715; --warn: #EDC961; --warn-soft: #2B2612;
  --focus: #43D6C5;
  --shadow: 0 10px 28px rgba(0,0,0,.55);
  /* Verläufe: Schwarz auf Dunkelgrün für Flächen, Teal-Schimmer für Hervorhebungen */
  --grad-page: radial-gradient(120% 70% at 100% 0%, #0E2C28 0%, transparent 60%), linear-gradient(180deg, #090C0C 0%, #0A1513 100%);
  --grad-surface: linear-gradient(160deg, #161E1D 0%, #111615 100%);
  --grad-head: linear-gradient(90deg, #0C2421 0%, #090C0C 85%);
  --grad-hi: linear-gradient(90deg, color-mix(in oklab, #43D6C5 22%, transparent) 0%, transparent 100%);
  --grad-primary: linear-gradient(135deg, #43D6C5 0%, #6FD39A 100%);
}
:root[data-theme='light'] {
  color-scheme: light;
  --bg: #F3F6F2; --surface: #FFFFFF; --raised: #E6EEEA; --border: #6B8A81; --line: #D5E3DE;
  --text: #10231F; --muted: #4C625C;
  --primary: #0A6E65; --primary-hover: #075C54; --on-primary: #FFFFFF;
  --leaf: #3F7F22;
  --bad: #B42318; --bad-soft: #FDECEA; --warn: #7A5200; --warn-soft: #FFF3CF;
  --focus: #0A6E65;
  --shadow: 0 10px 28px rgba(16,35,31,.16);
  --bg-deep: #E3EEEA;
  --grad-page: linear-gradient(180deg, #F3F6F2 0%, #EAF2EE 100%);
  --grad-surface: linear-gradient(160deg, #FFFFFF 0%, #FAFCFB 100%);
  --grad-head: linear-gradient(90deg, #E3EEEA 0%, #F3F6F2 85%);
  --grad-hi: linear-gradient(90deg, color-mix(in oklab, #0A6E65 14%, transparent) 0%, transparent 100%);
  --grad-primary: linear-gradient(135deg, #0A6E65 0%, #0B7D5E 100%);
}
:root {
  --radius-card: 14px; --radius-control: 999px; --radius-field: 10px;
  --t-fast: 150ms; --t-mid: 220ms; --ease-out: cubic-bezier(.2,.7,.2,1);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --touch: 2.75rem;
  --nav-h: 4rem; --side-w: 15rem;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--sans); }
body { background: var(--grad-page) fixed; min-height: 100vh; }
a { color: var(--primary); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ===== Entwurfsleiste (nicht Teil der App) ===== */
.dz { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: .4rem .8rem; align-items: center; padding: .4rem .75rem; background: #2b2b2b; color: #eee; font-size: 12px; border-bottom: 2px dashed #888; }
.dz b { color: #fff; }
.dz select, .dz button { background: #444; color: #fff; border: 1px solid #777; border-radius: 6px; padding: .15rem .4rem; font-size: 12px; }
.dz label { display: inline-flex; gap: .3rem; align-items: center; }
.dz .bp { margin-left: auto; background: #555; padding: .1rem .45rem; border-radius: 4px; }
.dz .whytxt { flex-basis: 100%; color: #ccc; font-size: 12px; }
.bsp { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; padding: 0 .3rem; border: 1px dashed #999; border-radius: 4px; color: #999; margin-left: .3rem; vertical-align: middle; white-space: nowrap; }
.tool { display: none; font: 11px/1.3 ui-monospace, Consolas, monospace; color: var(--muted); border: 1px dashed var(--border); border-radius: 6px; padding: .05rem .35rem; margin-left: .35rem; white-space: nowrap; }
body.tools .tool { display: inline-block; }

/* ===== Schale ===== */
.shell { min-height: 100vh; }
.side { display: none; }
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: var(--nav-h); display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.bottom a { display: grid; place-items: center; align-content: center; gap: .15rem; color: var(--muted); text-decoration: none; font-size: 12px; position: relative; }
.bottom a svg { width: 22px; height: 22px; }
.bottom a[aria-current='page'] { color: var(--primary); font-weight: 600; }
.bottom a[aria-current='page']::before { content: ''; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--primary); }
.count { min-width: 1.15rem; height: 1.15rem; padding: 0 .3rem; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
.bottom .count { position: absolute; top: .45rem; left: calc(50% + 6px); }
main { padding: 1rem 1rem calc(var(--nav-h) + 5.5rem); max-width: 72rem; margin: 0 auto; }
.brandbar { display: flex; align-items: center; gap: .5rem; padding: .7rem 1rem 0; max-width: 72rem; margin: 0 auto; }
.logo { display: inline-flex; align-items: center; gap: .45rem; font-weight: 800; letter-spacing: .14em; font-size: 14px; color: var(--text); text-decoration: none; }
.logo svg { width: 22px; height: 22px; color: var(--leaf); }
.brandbar .who { margin-left: auto; color: var(--muted); font-size: 13px; }

@media (min-width: 992px) {
  .shell { display: grid; grid-template-columns: var(--side-w) 1fr; }
  .bottom, .brandbar { display: none; }
  .side { display: flex; flex-direction: column; gap: .2rem; position: sticky; top: 0; height: 100vh; padding: 1.2rem 0; border-right: 1px solid var(--line); background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 55%); }
  .side .logo { padding: 0 1.4rem 1.2rem; }
  .side a.nav { display: flex; align-items: center; gap: .7rem; padding: .65rem 1.4rem; color: var(--muted); text-decoration: none; border-left: 3px solid transparent; }
  .side a.nav svg { width: 20px; height: 20px; }
  .side a.nav:hover { color: var(--text); background: var(--raised); }
  .side a.nav[aria-current='page'] { color: var(--text); background: var(--grad-hi); border-left-color: var(--primary); }
  .side a.nav[aria-current='page'] svg { color: var(--primary); }
  .side a.nav .count { margin-left: auto; }
  .side .foot { margin-top: auto; color: var(--muted); font-size: 12.5px; padding: 0 .7rem; }
  main { padding: 1.5rem 2rem 3rem; }
}

/* ===== Bauteile ===== */
h2 { font-size: 1.05rem; margin: 0; }
.sec { margin: 1.4rem 0 0; }
.sec-h { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .55rem; }
.sec-h h2 { font-size: .95rem; text-transform: none; }
.sec-h .more { margin-left: auto; font-size: 13.5px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Knopf-Rollen */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: var(--touch); padding: 0 1.1rem; border-radius: var(--radius-control); border: 1px solid var(--border); background: transparent; color: var(--text); font-weight: 600; cursor: pointer; text-decoration: none; transition: border-color var(--t-fast), background var(--t-fast), transform 80ms; }
.btn:hover { border-color: var(--primary); }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--grad-primary); border-color: transparent; color: var(--on-primary); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; color: var(--primary); padding: 0 .6rem; }
.btn.quiet:hover { background: var(--raised); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); }
.btn[aria-disabled='true'] { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 2.1rem; padding: 0 .8rem; font-size: 13.5px; }
.iconbtn { width: var(--touch); height: var(--touch); padding: 0; border-radius: 50%; }

/* Kennzeichen */
.plate { display: inline-flex; align-items: stretch; height: 1.9rem; border: 2px solid #1b1b1b; border-radius: 5px; background: #fafafa; color: #111; font: 700 1rem/1 "Arial Narrow", "Roboto Condensed", var(--sans); letter-spacing: .06em; overflow: hidden; white-space: nowrap; flex: none; }
.plate .eu { width: 1.15rem; background: #1f4fa0; color: #fff; font-size: 9px; display: grid; place-items: end center; padding-bottom: 2px; letter-spacing: 0; }
.plate .num { padding: 0 .5rem; display: grid; place-items: center; }
.plate.lg { height: 2.4rem; font-size: 1.3rem; }

/* Zustand */
.st { display: inline-flex; align-items: center; gap: .35rem; font-size: 13.5px; white-space: nowrap; }
.st::before { content: ''; width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); flex: none; }
.st.bad { color: var(--bad); font-weight: 600; } .st.bad::before { background: var(--bad); }
.st.warn { color: var(--warn); font-weight: 600; } .st.warn::before { background: var(--warn); }
.st.ok { color: var(--muted); }
.st.unk::before { background: transparent; border: 2px dashed var(--warn); }
.st.unk { color: var(--warn); }

/* Herkunft */
.src { display: inline-flex; align-items: center; gap: .25rem; height: 1.35rem; padding: 0 .45rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 11.5px; cursor: pointer; white-space: nowrap; vertical-align: middle; }
.src svg { width: 12px; height: 12px; }
.src:hover { border-color: var(--primary); color: var(--text); }
.src.unsicher { border-color: var(--warn); color: var(--warn); border-style: dashed; }
.src .c { width: .45rem; height: .45rem; border-radius: 50%; background: var(--muted); }
.src.bestaetigt .c { background: var(--primary); }
.src.wahrscheinlich .c { background: transparent; border: 1.5px solid var(--muted); }
.src.unsicher .c { background: transparent; border: 1.5px dashed var(--warn); }
.est { color: var(--muted); cursor: help; border-bottom: 1px dotted var(--muted); }

/* Kennzahlen-Leiste */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); }
.kpi { padding: .65rem .9rem; border-top: 1px solid var(--line); }
.kpi:nth-child(-n+2) { border-top: 0; }
.kpi:nth-child(even) { border-left: 1px solid var(--line); }
.kpi .v { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12.5px; color: var(--muted); }
.kpi.bad .v { color: var(--bad); }
.kpi.warn .v { color: var(--warn); }
.kpi a { color: inherit; text-decoration: none; display: block; }
@media (min-width: 600px) { .kpis { grid-template-columns: repeat(4, 1fr); } .kpi { border-top: 0; border-left: 1px solid var(--line); } .kpi:first-child { border-left: 0; } }

/* Listen */
.list { border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); }
.row { display: grid; grid-template-columns: 1fr auto; gap: .2rem .8rem; padding: .7rem .9rem; border-top: 1px solid var(--line); align-items: center; text-decoration: none; color: inherit; }
.row:first-child { border-top: 0; }
a.row:hover, button.row:hover { background: var(--raised); }
button.row { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); cursor: pointer; }
.row .t { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.row .s { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: .3rem .6rem; align-items: center; }
.row .r { text-align: right; }

/* Fahrzeugkarten */
.cars { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr)); }
.group { border: 1px solid var(--line); border-radius: calc(var(--radius-card) + 4px); padding: .8rem; background: color-mix(in oklab, var(--surface) 45%, var(--bg)); }
.group-h { display: flex; align-items: center; gap: .6rem; margin: 0 0 .7rem .2rem; }
.group-h h2 { font-size: .95rem; }
.car { position: relative; display: block; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); overflow: hidden; text-decoration: none; color: inherit; container-type: inline-size; transition: border-color var(--t-fast); }
.car:hover { border-color: var(--primary); }
.car .bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(22px) saturate(.8); opacity: .22; transform: scale(1.2); }
.car .in { position: relative; padding: .9rem; display: grid; gap: .7rem; }
.car .top { display: flex; gap: .8rem; align-items: center; }
.car .thumb { width: 5.5rem; height: 3.8rem; border-radius: 9px; background: var(--raised) center/cover; flex: none; display: grid; place-items: center; color: var(--muted); }
.car .thumb svg { width: 30px; height: 30px; }
.car .name { font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere; }
.car .meta { display: grid; grid-template-columns: 1fr 1fr; gap: .1rem .8rem; font-size: 13.5px; }
.car .meta dt { color: var(--muted); font-size: 12px; }
.car .meta dd { margin: 0 0 .35rem; font-weight: 600; }
.car .foot { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; font-size: 13px; border-top: 1px solid var(--line); padding-top: .6rem; }
.car.retired { opacity: .75; }

/* Fahrzeugkopf + Reiter */
.vhead { display: flex; align-items: center; gap: .6rem; min-height: 3rem; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: .2rem; color: var(--primary); text-decoration: none; font-weight: 600; min-height: var(--touch); padding-right: .3rem; }
.back svg { width: 18px; height: 18px; }
.vhead .nm { font-weight: 700; overflow-wrap: anywhere; }
.vhead .menu { margin-left: auto; }
.tabs { position: sticky; top: 0; z-index: 20; display: flex; gap: .2rem; overflow-x: auto; scrollbar-width: none; margin: .4rem -1rem 1rem; padding: 0 1rem; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; padding: .75rem .7rem .65rem; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; display: inline-flex; gap: .35rem; align-items: center; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-selected='true'] { color: var(--text); border-bottom-color: var(--primary); }
.tabs .count { background: var(--raised); color: var(--text); }
@media (min-width: 992px) { .tabs { margin: .4rem 0 1.2rem; padding: 0; } }
body.has-dz .tabs { top: 0; }

.panel { animation: fade var(--t-mid) var(--ease-out); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.cols { display: grid; gap: 0 1.6rem; }
@media (min-width: 992px) { .cols { grid-template-columns: 1.35fr 1fr; } }

/* Fortschritt */
.bar { position: relative; height: .45rem; border-radius: 999px; background: var(--raised); overflow: hidden; min-width: 5rem; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--muted); }
.bar.bad i { background: var(--bad); }
.bar.warn i { background: var(--warn); }

/* Tabelle */
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: .55rem .8rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: .6rem .8rem; border-top: 1px solid var(--line); vertical-align: middle; }
.tbl tr:first-child td { border-top: 0; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr.sub td { background: color-mix(in oklab, var(--raised) 55%, var(--surface)); font-size: 13px; }

/* Werkzeugleiste Liste */
.tb { display: flex; gap: .5rem; align-items: center; margin-bottom: .8rem; flex-wrap: wrap; }
.tb .seg { margin-left: auto; display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.tb .seg button { border: 0; background: none; min-height: 2.2rem; padding: 0 .8rem; cursor: pointer; color: var(--muted); font-size: 13.5px; display: inline-flex; align-items: center; gap: .3rem; }
.tb .seg button svg { width: 16px; height: 16px; }
.tb .seg button[aria-pressed='true'] { background: color-mix(in oklab, var(--primary) 18%, var(--surface)); color: var(--text); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: .3rem; min-height: 2.2rem; padding: 0 .85rem; border-radius: 999px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; font-size: 13.5px; }
.chip[aria-pressed='true'] { border-color: var(--primary); color: var(--text); background: color-mix(in oklab, var(--primary) 14%, var(--surface)); }
.chip[aria-pressed='true']::before { content: '✓'; color: var(--primary); font-weight: 700; }

/* Zeitstrahl */
.tl { position: relative; margin-left: .55rem; padding-left: 1.3rem; border-left: 2px solid var(--line); }
.ev { position: relative; margin-bottom: .8rem; }
.ev::before { content: ''; position: absolute; left: calc(-1.3rem - 7px); top: 1.05rem; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--primary); }
.ev.gap::before { border-color: var(--bad); background: var(--bad); }
.ev .card { border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); }
.ev details > summary { list-style: none; cursor: pointer; padding: .7rem .9rem; display: grid; grid-template-columns: 1fr auto; gap: .15rem .8rem; align-items: center; }
.ev details > summary::-webkit-details-marker { display: none; }
.ev details > summary:hover { background: var(--raised); border-radius: var(--radius-card); }
.ev .d { font-size: 12.5px; color: var(--muted); }
.ev .ttl { font-weight: 700; overflow-wrap: anywhere; }
.ev .sum { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.ev .body { padding: 0 .9rem .9rem; border-top: 1px solid var(--line); }
.ev .actions { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .7rem; }
.gapcard { border: 1.5px dashed var(--bad); border-radius: var(--radius-card); padding: .65rem .9rem; color: var(--bad); background: var(--bad-soft); font-size: 14px; }
.kind { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--primary); }
.year { font-weight: 800; color: var(--muted); margin: 1.1rem 0 .5rem -2.05rem; background: var(--bg); padding: .1rem 0; font-size: 13px; width: max-content; }

/* Anhänge-Leiste */
.att { display: flex; gap: .45rem; margin-top: .7rem; overflow-x: auto; }
.att button { flex: none; width: 4.2rem; height: 5.2rem; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); display: grid; place-items: center; color: var(--muted); font-size: 11px; cursor: pointer; padding: .3rem; text-align: center; }
.att button svg { width: 22px; height: 22px; }

/* Klärfälle */
.oi { border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); padding: .9rem; margin-bottom: .8rem; }
.oi-h { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .5rem; }
.oi-h .kindtag { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--warn); }
.oi .q { font-weight: 600; margin: 0 0 .7rem; overflow-wrap: anywhere; }
.vs { display: grid; gap: .6rem; grid-template-columns: 1fr; }
@media (min-width: 560px) { .vs { grid-template-columns: 1fr 1fr; } }
.opt { border: 1px solid var(--border); border-radius: 12px; padding: .7rem .8rem; display: grid; gap: .45rem; align-content: start; }
.opt .lab { font-size: 12px; color: var(--muted); font-weight: 600; }
.opt .val { font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
.oi .acts { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .8rem; align-items: center; }
.oi .note { width: 100%; }

/* Felder */
.field { display: grid; gap: .3rem; margin-top: .8rem; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field select, .field textarea { min-height: var(--touch); border-radius: var(--radius-field); border: 1px solid var(--border); background: var(--bg); color: var(--text); padding: .5rem .7rem; font: inherit; }
.field textarea { min-height: 4.5rem; }
.radio { display: grid; gap: .4rem; margin-top: .6rem; }
.radio label { display: flex; gap: .6rem; align-items: center; min-height: var(--touch); padding: 0 .8rem; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
.radio label:has(input:checked) { border-color: var(--primary); background: color-mix(in oklab, var(--primary) 12%, var(--surface)); }
.radio input { accent-color: var(--primary); width: 18px; height: 18px; }

/* Blatt / Dialog */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); display: grid; align-items: end; }
.sheet { background: var(--surface); border-radius: 18px 18px 0 0; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom)); max-height: 88vh; overflow: auto; box-shadow: var(--shadow); animation: up var(--t-mid) var(--ease-out); }
.sheet .grab { width: 2.5rem; height: 4px; border-radius: 4px; background: var(--border); margin: 0 auto .8rem; }
.sheet h2 { font-size: 1.1rem; }
.sheet .foot { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1.1rem; flex-wrap: wrap; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 768px) { .scrim { place-items: center; } .sheet { width: min(32rem, 92vw); border-radius: 18px; } .sheet .grab { display: none; } }

/* Menü */
.pop { position: absolute; right: 0; top: 100%; z-index: 40; min-width: 14rem; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: .3rem; }
.pop button { display: flex; width: 100%; gap: .6rem; align-items: center; min-height: var(--touch); padding: 0 .7rem; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: left; }
.pop button:hover { background: var(--raised); }
.pop button.dangerous { color: var(--bad); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: .3rem 0; }

/* Schwebender Kamera-Knopf */
.fab { position: fixed; right: 1rem; bottom: calc(var(--nav-h) + 1rem); z-index: 25; height: 3.5rem; min-width: 3.5rem; border-radius: 999px; border: 0; background: var(--grad-primary); color: var(--on-primary); display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: 0 1.1rem; font-weight: 700; box-shadow: var(--shadow); cursor: pointer; text-decoration: none; }
.fab svg { width: 22px; height: 22px; }
@media (min-width: 992px) { .fab { bottom: 1.5rem; right: 1.5rem; } }

/* Toast mit Rückgängig */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 5.2rem); transform: translateX(-50%); z-index: 70; display: flex; gap: .8rem; align-items: center; background: var(--text); color: var(--bg); padding: .55rem .6rem .55rem 1rem; border-radius: 12px; box-shadow: var(--shadow); max-width: calc(100vw - 2rem); font-size: 14px; animation: up var(--t-mid) var(--ease-out); }
.toast button { background: none; border: 0; color: var(--bg); font-weight: 800; text-decoration: underline; min-height: 2.2rem; cursor: pointer; padding: 0 .4rem; }
@media (min-width: 992px) { .toast { bottom: 2rem; } }

/* Popover Herkunft */
.tip { position: fixed; z-index: 65; max-width: 19rem; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: .7rem .8rem; font-size: 13.5px; }
.tip dl { display: grid; grid-template-columns: auto 1fr; gap: .2rem .7rem; margin: .3rem 0 .5rem; }
.tip dt { color: var(--muted); }
.tip dd { margin: 0; }

/* Leere, Laden, Fehler */
.empty { border: 1.5px dashed var(--border); border-radius: var(--radius-card); padding: 1.6rem 1rem; text-align: center; display: grid; gap: .6rem; justify-items: center; }
.empty svg { width: 36px; height: 36px; color: var(--muted); }
.empty .h { font-weight: 700; }
.skel { border-radius: var(--radius-card); background: linear-gradient(90deg, var(--surface), var(--raised), var(--surface)); background-size: 200% 100%; animation: sk 1.2s linear infinite; height: 9rem; margin-bottom: .8rem; }
@keyframes sk { to { background-position: -200% 0; } }
.err { border: 1px solid var(--bad); background: var(--bad-soft); color: var(--text); border-radius: var(--radius-card); padding: .9rem; display: grid; gap: .5rem; }
.err b { color: var(--bad); }
.banner { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: var(--radius-card); padding: .65rem .9rem; display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; margin-bottom: .9rem; font-size: 14px; }
.banner b { color: var(--warn); }

/* Diagramme */
.chart { border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); padding: .8rem; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: .4rem; }
.chart .legend i { display: inline-block; width: 1.2rem; height: 0; border-top: 2px solid var(--primary); vertical-align: middle; margin-right: .3rem; }
.chart .legend i.dash { border-top-style: dashed; }
.chart .legend i.min { border-top-color: var(--bad); }
.wheels { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.wheel { border: 1px solid var(--line); border-radius: 12px; padding: .6rem .7rem; background: var(--surface); }
.wheel .p { font-size: 12px; color: var(--muted); font-weight: 600; }
.wheel .v { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Reifen */
.tires { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); }
.tire { border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); padding: .9rem; display: grid; gap: .5rem; }
.tire.on { border-color: var(--primary); box-shadow: inset 4px 0 0 var(--primary); }
.tire .hd { display: flex; gap: .5rem; align-items: center; }
.tire .hd b { overflow-wrap: anywhere; }
.tire dl { display: grid; grid-template-columns: auto 1fr; gap: .15rem .8rem; margin: 0; font-size: 13.5px; }
.tire dt { color: var(--muted); }
.tire dd { margin: 0; }

/* Teile */
.copy { display: inline-flex; align-items: center; gap: .3rem; font: 600 13px/1 ui-monospace, Consolas, monospace; border: 1px solid var(--border); border-radius: 8px; background: none; color: var(--text); min-height: 2rem; padding: 0 .55rem; cursor: pointer; }
.copy svg { width: 14px; height: 14px; color: var(--muted); }
.copy:hover { border-color: var(--primary); }

/* Belege-Raster */
.docs { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); }
.doc { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; text-align: left; padding: 0; cursor: pointer; }
.doc .pv { aspect-ratio: 3/4; background: repeating-linear-gradient(0deg, var(--raised) 0 10px, var(--surface) 10px 12px); display: grid; place-items: center; color: var(--muted); }
.doc .pv svg { width: 30px; height: 30px; }
.doc .cap { padding: .45rem .55rem; font-size: 12.5px; }
.doc .cap b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Stammdaten */
.facts { display: grid; grid-template-columns: 1fr; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--surface); }
.fact { display: grid; grid-template-columns: minmax(6.5rem, 11rem) 1fr 6.8rem; gap: .6rem; padding: .55rem .9rem; border-top: 1px solid var(--line); align-items: center; font-size: 14px; }
.fact:first-child { border-top: 0; }
.fact .k { color: var(--muted); font-size: 13px; }
.fact .v { display: flex; flex-wrap: wrap; gap: .1rem .5rem; align-items: baseline; min-width: 0; overflow-wrap: anywhere; }
.fact .b { justify-self: start; }
.fact.disputed .v > span:first-child { color: var(--warn); font-weight: 600; }

/* Auswahl (gestaltet statt Browser-Element) */
.dd { position: relative; display: inline-block; }
.dd > button { display: inline-flex; align-items: center; gap: .5rem; min-height: 2.4rem; padding: 0 .75rem 0 .9rem; border: 1px solid var(--border); border-radius: var(--radius-field); background: var(--grad-surface); color: var(--text); cursor: pointer; font-weight: 600; font-size: 14px; }
.dd > button:hover { border-color: var(--primary); }
.dd > button svg { width: 16px; height: 16px; color: var(--muted); transition: transform var(--t-fast); }
.dd > button[aria-expanded='true'] svg { transform: rotate(180deg); }
.dd [role=listbox] { position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; min-width: 100%; width: max-content; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: .3rem; margin: 0; list-style: none; }
.dd.up [role=listbox] { top: auto; bottom: calc(100% + 4px); }
.dd [role=option] { display: flex; align-items: center; gap: .6rem; min-height: var(--touch); padding: 0 .8rem 0 .6rem; border-radius: 8px; cursor: pointer; color: var(--text); }
.dd [role=option]::before { content: ''; width: 1rem; text-align: center; color: var(--primary); font-weight: 800; }
.dd [role=option][aria-selected='true'] { background: var(--grad-hi); }
.dd [role=option][aria-selected='true']::before { content: '✓'; }
.dd [role=option]:hover, .dd [role=option].active { background: var(--raised); }

/* Hintergrundbild des Inhaltsbereichs: nur Struktur, kaum sichtbar */
.content { position: relative; isolation: isolate; min-width: 0; }
.content::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: url('_entwurf-oberflaeche/hintergrund.jpg') center bottom / cover no-repeat; opacity: .16; }
:root[data-theme='light'] .content::before { filter: invert(1) hue-rotate(180deg); opacity: .07; }
@media (min-width: 992px) { .content::before { left: var(--side-w); } }

/* Aktionen am Fahrzeug, direkt sichtbar */
.vacts { display: flex; gap: .3rem; flex-wrap: wrap; margin-left: auto; }
.vacts .btn { min-height: 2.1rem; padding: 0 .65rem; font-size: 13px; font-weight: 600; gap: .35rem; }
.vacts .btn svg { width: 16px; height: 16px; }
@media (max-width: 767px) { .vacts { margin-left: -.45rem; width: calc(100% + .45rem); gap: 0; flex-wrap: nowrap; } .vacts .btn { padding: 0 .45rem; } }
.facts.two { display: grid; }
@media (min-width: 992px) { .facts.two { grid-template-columns: 1fr 1fr; } .facts.two .fact:nth-child(2) { border-top: 0; } .facts.two .fact:nth-child(even) { border-left: 1px solid var(--line); } }

/* Flächen mit Verlauf (dunkel: Schwarz-Grau, hell: Weiß) */
.list, .kpis, .car, .ev .card, .oi, .tire, .chart, .facts, .wheel, .doc, .tbl { background: var(--grad-surface); }
.group { background: linear-gradient(180deg, color-mix(in oklab, var(--bg-deep) 70%, transparent) 0%, transparent 70%); }
.bottom { background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%); }
.tabs a[aria-selected='true'] { background: linear-gradient(0deg, color-mix(in oklab, var(--primary) 14%, transparent) 0%, transparent 70%); }
.tire.on, .car:hover { border-color: var(--primary); }

/* Druckansicht */
.print { background: #fff; color: #111; border-radius: 6px; padding: 1.4rem; max-width: 46rem; margin: 0 auto; font-size: 13px; box-shadow: var(--shadow); }
.print h1 { font-size: 1.4rem; margin: 0 0 .2rem; }
.print h2 { font-size: 1rem; margin: 1.1rem 0 .3rem; border-bottom: 1.5px solid #111; padding-bottom: .15rem; }
.print table { width: 100%; border-collapse: collapse; }
.print td, .print th { border-bottom: 1px solid #ccc; padding: .25rem .3rem; text-align: left; vertical-align: top; }
.print .h { color: #555; font-size: 11px; }
@media print { .dz, .side, .bottom, .brandbar, .why, .no-print, .fab { display: none !important; } .print { box-shadow: none; } main { padding: 0; } }
</style>

/* ===== Zustand ===== */
const narrow = () => innerWidth < 768;
const S = { role: 'inhaber', state: 'normal', views: { scheckheft: 'tl', wartung: narrow() ? 'cards' : 'tbl' }, deleted: new Set(), resolved: new Set(), openMenu: false, filter: 'aktiv', look: 'Dunkel' };
const canWrite = () => S.role !== 'lesend';
const canResolve = () => S.role !== 'lesend';
const isOwner = () => S.role === 'inhaber';
const tool = (t) => `<span class="tool">${t}</span>`;
const $ = (s, r = document) => r.querySelector(s);
const main = $('#main');
const layer = $('#layer');

function badge(src, conf, note = '') {
  return `<button class="src ${conf}" type="button" data-src="${src}" data-conf="${conf}" data-note="${note}" aria-label="Herkunft: ${SRC_LABEL[src]}, ${CONF_LABEL[conf]}">${I.src[src]}${SRC_LABEL[src]}<span class="c" aria-hidden="true"></span></button>`;
}
function plate(p, lg = false) {
  return `<span class="plate${lg ? ' lg' : ''}" aria-label="Kennzeichen ${p}"><span class="eu" aria-hidden="true">D</span><span class="num">${p.replace(' ', ' · ').replace(/ (\d)/, ' $1')}</span></span>`;
}
function st(s, text) { return `<span class="st ${s}">${text}</span>`; }
function openOi(v) { return D.openItems.filter(o => (!v || o.v === v) && !S.resolved.has(o.id)); }

let WHY = '';
function why(text) { WHY = text; return ''; }
function dd(id, label, options, value) {
  return `<div class="dd" data-dd="${id}"><button type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="${label}: ${value}"><span>${value}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <ul role="listbox" aria-label="${label}" hidden>${options.map(o => `<li role="option" tabindex="-1" aria-selected="${o === value}">${o}</li>`).join('')}</ul></div>`;
}
function stateBlock(kind, next) {
  if (S.state === 'laden') return '<div role="status" aria-live="polite" class="sr-only">Lädt …</div><div class="skel"></div><div class="skel"></div>';
  if (S.state === 'fehler') return `<div class="err" role="alert"><b>GARAGE ist gerade nicht erreichbar.</b><span>Deine Daten sind sicher. Prüfe die Verbindung und lade neu.</span><div><button class="btn sm" type="button" data-act="reload">Neu laden</button></div></div>`;
  if (S.state === 'leer') return `<div class="empty">${I.car}<div class="h">${kind}</div><div class="muted small">${next}</div></div>`;
  return null;
}

/* ===== Garage ===== */
function viewGarage() {
  const s = stateBlock('Noch kein Fahrzeug', 'Sag deinem Agenten im Chat: „Leg meinen Golf in GARAGE an“ und gib ihm ein Foto vom Fahrzeugschein.');
  const all = Object.values(D.vehicles);
  const shown = all.filter(v => S.filter === 'gelöscht' ? v.status === 'geloescht' : v.status !== 'geloescht' && (S.filter === 'alle' || v.status === S.filter));
  const overdue = 2, oiN = openOi().length;
  return `<h1 class="sr-only">Garage</h1>
  ${why('Auf einen Blick sehen, welches Auto Aufmerksamkeit braucht, und hineinspringen. Häufigste Aufgabe: „Steht was an?“ — deshalb Fälligkeit und Klärfälle auf jeder Karte.')}
  ${s ?? `
  <div class="kpis" role="list">
    <div class="kpi" role="listitem"><a href="#garage"><div class="v">2</div><div class="l">Fahrzeuge aktiv</div></a></div>
    <div class="kpi bad" role="listitem"><a href="#fz/golf/wartung"><div class="v">${overdue}</div><div class="l">überfällig</div></a></div>
    <div class="kpi warn" role="listitem"><a href="#klaerfaelle"><div class="v">${oiN}</div><div class="l">Klärfälle offen</div></a></div>
    <div class="kpi" role="listitem"><a href="#eingang"><div class="v">1</div><div class="l">neu im Eingang</div></a></div>
  </div>
  <div class="sec">
    <div class="tb" role="group" aria-label="Status filtern">
      ${['aktiv', 'verkauft', 'stillgelegt', 'alle', ...(isOwner() ? ['gelöscht'] : [])].map(f => `<button type="button" class="chip" data-filter="${f}" aria-pressed="${S.filter === f}">${f[0].toUpperCase() + f.slice(1)}</button>`).join('')}
    </div>
    <div class="group">
      <div class="group-h"><h2>Familie</h2>${B}<span class="muted small">Inhaber · 2 aktiv, 1 verkauft</span></div>
      <div class="cars">${shown.map(carCard).join('') || `<div class="empty"><div class="h">Kein Fahrzeug mit diesem Status</div><button class="btn sm" data-filter="alle" type="button">Alle zeigen</button></div>`}</div>
    </div>
  </div>
  <p class="muted small">Unterhalt pro Monat und Wertspanne erscheinen hier mit Meilenstein 5 — bis dahin keine Platzhalter.</p>`}`;
}
function carCard(v) {
  const thumb = v.photo ? `<div class="thumb" style="background-image:url('${v.photo}')" role="img" aria-label="Titelbild ${v.label}"></div>` : `<div class="thumb">${I.car}</div>`;
  const retired = v.status !== 'aktiv';
  if (v.status === 'geloescht') return `<div class="car retired"><div class="in"><div class="top"><div class="thumb">${I.car}</div><div style="min-width:0;display:grid;gap:.35rem">${plate(v.plate)}<div class="name">${v.label}</div></div></div>
    <div class="muted small">${v.reason}</div><div><button class="btn sm" type="button" data-act="restorecar">Wiederherstellen</button>${tool('POST /garage/api/vehicles/{id}/restore · nur Inhaber')}</div></div></div>`;
  return `<a class="car${retired ? ' retired' : ''}" href="#fz/${v.id}/uebersicht">
    ${v.photo ? `<div class="bg" style="background-image:url('${v.photo}')"></div>` : ''}
    <div class="in">
      <div class="top">${thumb}<div style="min-width:0;display:grid;gap:.35rem">${plate(v.plate)}<div class="name">${v.label}${v.photo ? B : ''}</div></div></div>
      ${retired ? `<div class="muted small">${st('ok', v.reason)}</div>` : `
      <dl class="meta">
        <div><dt>km heute</dt><dd><span class="est" title="Geschätzt: ${v.kmBasis}">≈ ${v.km.toLocaleString('de-DE')}</span></dd></div>
        <div><dt>Nächste Fälligkeit</dt><dd>${st(v.next.s, v.next.t)}<div class="muted small">${v.next.when}</div></dd></div>
      </dl>
      <div class="foot">${v.oi ? `<span class="st warn">${openOi(v.id).length} Klärfälle</span>` : '<span class="st ok">keine Klärfälle</span>'}<span class="muted">${v.docs} Belege</span>${tool('list_vehicles')}</div>`}
    </div></a>`;
}

/* ===== Fahrzeug ===== */
const TABS = [['uebersicht', 'Übersicht'], ['scheckheft', 'Scheckheft'], ['wartung', 'Wartung'], ['messwerte', 'Messwerte'], ['reifen', 'Reifen'], ['teile', 'Teile'], ['belege', 'Belege']];
function viewVehicle(id, tab) {
  const v = D.vehicles[id] ?? D.vehicles.golf;
  const head = `<h1 class="sr-only">${v.label} – ${TABS.find(t => t[0] === tab)?.[1]}</h1>
  <div class="vhead">
    <a class="back" href="#garage">${I.back}Garage</a>
    ${plate(v.plate)}<span class="nm">${v.label}</span>
    ${v.status !== 'aktiv' ? st('ok', v.status) : ''}
    <div class="vacts" role="group" aria-label="Aktionen zum Fahrzeug">
      <button class="btn quiet" type="button" data-act="print">${I.print}Drucken</button>
      <button class="btn quiet" type="button" data-act="md">${I.doc}Markdown</button>
      ${isOwner() ? `<button class="btn quiet" type="button" data-act="status">${I.car}Status</button>
      <button class="btn quiet" type="button" data-act="delcar" style="color:var(--bad)">${I.trash}Löschen</button>` : ''}
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Bereiche des Fahrzeugs">
    ${TABS.map(([k, l]) => `<a role="tab" href="#fz/${v.id}/${k}" aria-selected="${k === tab}">${l}${k === 'uebersicht' && openOi(v.id).length ? `<span class="count">${openOi(v.id).length}</span>` : ''}</a>`).join('')}
  </nav>`;
  const body = ({ uebersicht: tabOverview, scheckheft: tabBook, wartung: tabPlan, messwerte: tabMeasure, reifen: tabTires, teile: tabParts, belege: tabDocs })[tab](v);
  const fab = v.status === 'aktiv' && canWrite() ? `<a class="fab" href="#eingang" aria-label="Beleg fotografieren">${I.cam}<span>Beleg</span></a>` : '';
  return head + `<div class="panel" data-tab="${tab}">${body}</div>` + fab;
}

function dueList(v, n = 4) {
  const items = (D.due[v.id] ?? D.due.golf).slice(0, n);

    <span class="t">${d.t}</span><span class="r">${st(d.s, d.label)}</span>
    <span class="s">nächstes ${d.next}${d.km !== '–' ? ' · ' + d.km : ''}${d.unsure ? ' · <span style="color:var(--warn)">Regel unsicher</span>' : ''}</span></a>`).join('')}</div>`;
}

    <div class="kpi"><div class="v"><span class="est" title="Geschätzt: ${v.kmBasis}">≈ ${v.km?.toLocaleString('de-DE')}</span></div><div class="l">km heute ${tool('get_vehicle.km_estimate')}</div></div>

function kmChart(m) {
  const W = narrow() ? 340 : 640, H = narrow() ? 200 : 220, pl = 40, pr = 10, pt = 12, pb = 28;
  const pts = m.km.concat(m.prog.slice(1));
  const min = 16000, max = 29000;
  const x = i => pl + i * (W - pl - pr) / (pts.length - 1);
  const y = v => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
  const real = m.km.map((p, i) => `${x(i)},${y(p[1])}`).join(' ');
  const prog = m.prog.map((p, i) => `${x(m.km.length - 1 + i)},${y(p[1])}`).join(' ');
  const grid = [18000, 22000, 26000].map(g => `<line x1="${pl}" x2="${W - pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(g) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${(g / 1000)}k</text>`).join('');
  const labels = pts.map((p, i) => (narrow() && i % 2) ? '' : `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${p[0]}</text>`).join('');
  const dots = m.km.map((p, i) => `<circle cx="${x(i)}" cy="${y(p[1])}" r="3.5" fill="var(--primary)"><title>${p[0]}: ${p[1].toLocaleString('de-DE')} km</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilometerverlauf von 17.000 km (06/2021) bis 26.921 km (10/2026), Prognose 28.400 km im März 2027">${grid}${labels}<polyline points="${real}" fill="none" stroke="var(--primary)" stroke-width="2.5"/><polyline points="${prog}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-dasharray="6 5"/>${dots}</svg>`;
}

/* ===== Router ===== */
function route() {
  const h = location.hash.slice(1) || 'garage';
  const parts = h.split('/');
  let html, nav;
  if (parts[0] === 'fz') { html = viewVehicle(parts[1], parts[2] || 'uebersicht'); nav = 'garage'; }
  else if (parts[0] === 'klaerfaelle') { html = viewOpenItems(); nav = 'klaerfaelle'; }
  else if (parts[0] === 'eingang') { html = viewInbox(); nav = 'eingang'; }
  else if (parts[0] === 'konto') { html = viewAccount(); nav = 'konto'; }
  else if (parts[0] === 'druck') { html = viewPrint(parts[1]); nav = 'garage'; }
  else { html = viewGarage(); nav = 'garage'; }
  main.innerHTML = html;
  $('#dz-why').textContent = WHY ? 'Wofür: ' + WHY : '';
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.querySelectorAll('[data-c=oi]').forEach(c => { const n = openOi().length; c.textContent = n; c.hidden = !n; });
  document.querySelectorAll('[data-c=inbox]').forEach(c => { c.textContent = 1; });
}
function rerender() { const y = scrollY; route(); scrollTo(0, y); }
addEventListener('hashchange', () => { S.openMenu = false; route(); scrollTo(0, 0); });

let toastTimer;
function toast(msg, undo) {
  clearTimeout(toastTimer);
  layer.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${msg}</span>${undo ? '<button type="button">Rückgängig</button>' : ''}`;
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  layer.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 6000);
}
function sheet(html, onOk) {
  layer.querySelector('.scrim')?.remove();
  const prev = document.activeElement;
  const s = document.createElement('div');
  s.className = 'scrim';
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab"></div>${html}</div>`;
  const close = () => { s.remove(); prev?.focus(); };
  s.addEventListener('click', e => { if (e.target === s || e.target.closest('[data-close]')) close(); if (e.target.closest('[data-ok]')) { onOk?.(s); close(); } });
  s.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  layer.appendChild(s);
  s.querySelector('input,select,textarea,button')?.focus();
}
function tip(btn) {
  layer.querySelector('.tip')?.remove();
  const r = btn.getBoundingClientRect();
  const t = document.createElement('div');
  t.className = 'tip'; t.setAttribute('role', 'dialog'); t.setAttribute('aria-label', 'Herkunft');
  t.innerHTML = `<b>Herkunft</b><dl><dt>Quelle</dt><dd>${SRC_LABEL[btn.dataset.src]}</dd><dt>Sicherheit</dt><dd>${CONF_LABEL[btn.dataset.conf]}</dd><dt>Beleg</dt><dd>${btn.dataset.note || '–'}</dd><dt>Erfasst</dt><dd>Agent (Claude) für Sascha, 07.10.2026 ${B}</dd></dl>${btn.dataset.src === 'beleg' ? '<button class="btn sm" type="button" data-act="doc">Beleg öffnen</button>' : ''}`;
  layer.appendChild(t);
  const w = t.offsetWidth;
  t.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px';
  t.style.top = (r.bottom + 6) + 'px';
}
function ddClose(except) { document.querySelectorAll('.dd').forEach(d => { if (d === except) return; d.querySelector('[role=listbox]').hidden = true; d.querySelector('button').setAttribute('aria-expanded', 'false'); }); }
function ddPick(li) {
  const d = li.closest('.dd'); const v = li.textContent;
  if (d.dataset.dd === 'look') { setTheme(v === 'Hell' ? 'light' : 'dark'); S.look = v; }
  rerender(); document.querySelector(`[data-dd=${d.dataset.dd}] > button`)?.focus();
}
document.addEventListener('keydown', e => {
  const d = e.target.closest?.('.dd'); if (!d) return;
  const list = d.querySelector('[role=listbox]'); const opts = [...list.querySelectorAll('[role=option]')];
  if (e.target.matches('.dd > button') && ['ArrowDown', 'Enter', ' '].includes(e.key)) { e.preventDefault(); e.target.click(); return; }
  const i = opts.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); opts[Math.min(i + 1, opts.length - 1)].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); opts[Math.max(i - 1, 0)].focus(); }
  if ((e.key === 'Enter' || e.key === ' ') && i >= 0) { e.preventDefault(); ddPick(opts[i]); }
  if (e.key === 'Escape') { ddClose(); d.querySelector('button').focus(); }
});
document.addEventListener('click', e => {
  const opt = e.target.closest('.dd [role=option]');
  if (opt) { ddPick(opt); return; }
  const ddb = e.target.closest('.dd > button');
  if (ddb) { const d = ddb.parentElement; const list = d.querySelector('[role=listbox]'); const open = list.hidden; ddClose(d); d.classList.toggle('up', ddb.getBoundingClientRect().bottom > innerHeight - 240); list.hidden = !open; ddb.setAttribute('aria-expanded', String(open)); if (open) (list.querySelector('[aria-selected=true]') || list.firstElementChild).focus(); return; }
  ddClose();
  const el = e.target.closest('button, a');
  if (!e.target.closest('.tip') && !e.target.closest('.src')) layer.querySelector('.tip')?.remove();
  if (!el) return;
  if (el.dataset.src) { tip(el); return; }
  if (el.dataset.filter) { S.filter = el.dataset.filter; rerender(); return; }
  if (el.dataset.view) { const [k, v] = el.dataset.view.split(':'); S.views[k] = v; rerender(); return; }
  if (el.dataset.copy) { navigator.clipboard?.writeText(el.dataset.copy); toast(`${el.dataset.copy} kopiert`); return; }
  if (el.dataset.resolve) {
    const id = +el.dataset.resolve, d = el.dataset.d;
    S.resolved.add(id); rerender();
    toast(d === 'verwerfen' ? 'Klärfall verworfen' : 'Entscheidung gespeichert', () => { S.resolved.delete(id); rerender(); });
    return;
  }
  const act = el.dataset.act;
  if (!act) return;
  if (act === 'delev') {
    const i = el.dataset.i; S.deleted.add('ev' + i); rerender();
    toast('Ereignis gelöscht — im Verlauf sichtbar', () => { S.deleted.delete('ev' + i); rerender(); });
    return;
  }
  if (act === 'status') {
    S.openMenu = false; rerender();
    sheet(`<h2 id="sh-t">Status des Golf ändern</h2><p class="muted small">Verkaufte und stillgelegte Fahrzeuge bleiben mit ganzer Akte erhalten, zählen aber nicht mehr bei Fälligkeiten.</p>
      <div class="radio" role="radiogroup" aria-label="Status"><label><input type="radio" name="st" checked> Aktiv</label><label><input type="radio" name="st"> Verkauft</label><label><input type="radio" name="st"> Stillgelegt</label></div>
      <div class="field"><label for="st-r">Grund (optional)</label><input id="st-r" placeholder="z. B. verkauft an Privat, 11/2026"></div>
      <div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" data-ok>Status speichern</button></div>${tool('PATCH /garage/api/vehicles/{id} · nur Inhaber')}`, () => toast('Status gespeichert', () => {}));
    return;
  }
  if (act === 'delcar') {
    S.openMenu = false; rerender();
    sheet(`<h2 id="sh-t">Golf Sportsvan löschen?</h2><p class="small">Das Fahrzeug verschwindet aus Garage, Fälligkeiten und Suche. Akte und Belege bleiben gespeichert und lassen sich bis zu 30 Tage wiederherstellen.</p>
      <div class="field"><label for="dl-r">Grund</label><input id="dl-r" placeholder="z. B. doppelt angelegt"></div>
      <div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn danger" type="button" data-ok>Fahrzeug löschen</button></div>${tool('DELETE /garage/api/vehicles/{id} · nur Inhaber, nur Mensch')}`, () => toast('Golf Sportsvan gelöscht', () => {}));
    return;
  }
  if (act === 'print' || act === 'md') { S.openMenu = false; if (act === 'print') location.hash = '#druck/golf'; else toast('Akte als Markdown heruntergeladen'); return; }
  if (act === 'doprint') { print(); return; }
  if (act === 'restorecar') { Object.assign(D.vehicles.golf2, { status: 'aktiv', km: 26921, kmBasis: 'ein Stand', next: { t: 'keine Regel', s: 'ok', when: 'noch kein Wartungsplan' } }); S.filter = 'aktiv'; rerender(); toast('Golf (doppelt) wiederhergestellt', () => { D.vehicles.golf2.status = 'geloescht'; rerender(); }); return; }
  if (act === 'doc') { sheet(`<h2 id="sh-t">Rechnung 4711</h2><div class="doc" style="pointer-events:none;margin:.8rem 0"><div class="pv" style="aspect-ratio:3/4;max-height:50vh">${I.doc}</div></div><p class="muted small">Vollbild mit Wischen wie in Meilenstein 3 (belege.html#beleg/&lt;id&gt;). ${B}</p><div class="foot"><button class="btn" type="button" data-close>Schließen</button></div>`); return; }
  if (act === 'note') { sheet(`<h2 id="sh-t">Notiz zur Entscheidung</h2><div class="field"><label for="n-t">Notiz (höchstens 500 Zeichen)</label><textarea id="n-t" maxlength="500" placeholder="z. B. Werkstatt hat 0W-20 freigegeben"></textarea></div><div class="foot"><button class="btn" type="button" data-close>Abbrechen</button><button class="btn primary" type="button" data-ok>Notiz übernehmen</button></div>`); return; }
  if (act === 'allfacts') { toast('Klappt alle Angaben, Ausstattung und Zulassungen auf'); return; }
  if (act === 'reload') { $('#dz-state').value = 'normal'; S.state = 'normal'; rerender(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.openMenu) { S.openMenu = false; rerender(); } });

/* ===== Entwurfsleiste ===== */
const params = new URLSearchParams(location.search);
const setTheme = t => { document.documentElement.dataset.theme = t; $('#dz-theme').value = t; S.look = t === 'light' ? 'Hell' : 'Dunkel'; };
setTheme(params.get('theme') || 'dark');
$('#dz-theme').onchange = e => { setTheme(e.target.value); rerender(); };
$('#dz-role').onchange = e => { S.role = e.target.value; rerender(); };
$('#dz-state').onchange = e => { S.state = e.target.value; rerender(); };
$('#dz-tools').onchange = e => document.body.classList.toggle('tools', e.target.checked);
$('#dz-jump').onchange = e => { if (e.target.value) location.hash = e.target.value; e.target.value = ''; };
if (params.get('tools')) { $('#dz-tools').checked = true; document.body.classList.add('tools'); }
if (params.get('state')) { S.state = params.get('state'); $('#dz-state').value = S.state; }
if (params.get('role')) { S.role = params.get('role'); $('#dz-role').value = S.role; }
const bp = () => { const w = innerWidth; $('#dz-bp').textContent = (w < 576 ? 'Handy' : w < 992 ? 'Tablet' : w < 1408 ? 'Laptop' : 'Desktop') + ' · ' + w + ' px'; };
addEventListener('resize', bp); bp();
route();
if (params.get('open') === 'status') document.querySelector('[data-act=status]')?.click();
if (params.get('open') === 'src') document.querySelector('.src')?.click();
if (params.get('open') === 'dd') document.querySelector('.dd > button')?.click();</script>
